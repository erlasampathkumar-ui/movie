<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e27" />
      <stop offset="50%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#0c0c10" stroke="url(#redGlow)" stroke-width="4"/>
  <!-- Cinema Reel Ring -->
  <circle cx="50" cy="50" r="32" stroke="#e50914" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.8"/>
  <!-- Film Spool Notches -->
  <circle cx="50" cy="28" r="4" fill="#e50914"/>
  <circle cx="69" cy="40" r="4" fill="#e50914"/>
  <circle cx="69" cy="62" r="4" fill="#e50914"/>
  <circle cx="50" cy="72" r="4" fill="#e50914"/>
  <circle cx="31" cy="62" r="4" fill="#e50914"/>
  <circle cx="31" cy="40" r="4" fill="#e50914"/>
  <!-- Inner Play Polygon with Glow -->
  <polygon points="44,36 64,50 44,64" fill="url(#redGlow)" filter="url(#neonBlur)"/>
</svg>
