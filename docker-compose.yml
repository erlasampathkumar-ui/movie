version: '3.8'

services:
  cinered-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinered-movie-app
    ports:
      - "80:80"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
